<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minhas caixinhas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Minhas caixinhas</h1>
    <p class="suave">Registre cada entrada e cada uso. O app separa o dízimo e distribui o restante pelas esferas.</p>
    <p id="aviso" class="aviso" role="alert" hidden></p>

    <section>
      <label for="mes">Mês</label>
      <input id="mes" type="month">
    </section>

    <section>
      <h2>Registrar entrada</h2>
      <form id="form-entrada" class="grade">
        <div>
          <label for="entrada-data">Data</label>
          <input id="entrada-data" type="date" required>
        </div>
        <div>
          <label for="entrada-valor">Valor (R$)</label>
          <input id="entrada-valor" type="number" inputmode="decimal" min="0.01" step="0.01" required>
        </div>
        <div class="inteira">
          <label for="entrada-descricao">Descrição</label>
          <input id="entrada-descricao" type="text" placeholder="Ex.: bolsa, estágio">
        </div>
        <button class="inteira" type="submit">Registrar entrada</button>
      </form>
    </section>

    <section>
      <h2>Registrar uso</h2>
      <form id="form-uso" class="grade">
        <div>
          <label for="uso-data">Data</label>
          <input id="uso-data" type="date" required>
        </div>
        <div>
          <label for="uso-valor">Valor (R$)</label>
          <input id="uso-valor" type="number" inputmode="decimal" min="0.01" step="0.01" required>
        </div>
        <div class="inteira">
          <label for="uso-esfera">Esfera</label>
          <select id="uso-esfera"></select>
        </div>
        <div class="inteira">
          <label for="uso-descricao">Descrição</label>
          <input id="uso-descricao" type="text" placeholder="Ex.: mercado, livro de farmacologia">
        </div>
        <button class="inteira" type="submit">Registrar uso</button>
      </form>
    </section>

    <section id="indicador" aria-live="polite"></section>

    <section>
      <h2>Esferas</h2>
      <div id="esferas"></div>
    </section>

    <section>
      <h2>Registros do mês</h2>
      <div id="historico"></div>
    </section>

    <section>
      <details>
        <summary>Ajustes e backup</summary>
        <div class="grade">
          <div>
            <label for="ajuste-dizimo">Dízimo (% de cada entrada)</label>
            <input id="ajuste-dizimo" type="number" inputmode="decimal" min="0" max="100" step="0.5">
          </div>
          <div></div>
          <div>
            <label for="ajuste-meta-reserva">Meta da reserva (R$)</label>
            <input id="ajuste-meta-reserva" type="number" inputmode="decimal" min="0" step="0.01">
          </div>
          <div>
            <label for="ajuste-meta-renda">Meta da renda passiva (R$)</label>
            <input id="ajuste-meta-renda" type="number" inputmode="decimal" min="0" step="0.01">
          </div>
          <button id="botao-exportar" class="inteira" type="button">Baixar backup</button>
          <div class="inteira">
            <label for="arquivo-backup">Restaurar de um backup</label>
            <input id="arquivo-backup" type="file" accept="application/json">
          </div>
        </div>
      </details>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
